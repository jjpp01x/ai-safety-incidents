[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisid"
version = "1.0.0"
description = "Dashboard de incidentes de AI safety: taxonomia, severidad y analisis de causa raiz"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "streamlit==1.60.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
